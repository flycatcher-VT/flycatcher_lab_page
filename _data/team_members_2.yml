- name: Dr. Daniel Matute
  photo: Daniel.png
  info: Professor
  email: dmatute@email.unc.edu
  bio : "Dr. Daniel Matute is head of the Matute Lab and a professor in the Department of Biology at the University of North Carolina at Chapel Hill.
    He has dedicated his career to understanding the genetic origins of speciation and genetic diversity. He recieved his BSc in Microbiology and Biology from Los Andes University in Bogota, Colombia.
    He continued his education under Dr. Jerry Coyne at the University of Chicago, where he earned his PhD in Evolutionary Biology pursuing the factors that promoted and discouraged speciation in a natural hybrid zone of Drosophila. 
    After recieving his PhD, he completed a postdoctoral fellowship in the lab of Dr. Molly Przeworski at the University of Chicago, where he studied the genetic basis of adaptation in natural populations. 
    He joined the faculty at UNC-Chapel Hill in 2014, where his lab continues to produce high impact research and researchers."


- name: Dr. Victoria Sepulveda 
  photo: Vicky.jpg
  info: Senior Research Associate
  email: vsepulve@email.unc.edu
  bio : "Vicky studies how virulence strategies have evolved in dimorphic fungal pathogens, enabling strains to become pathogenic, 
    cause diverse disease manifestations and induce a wide range of host immune responses. She received her BSc in Microbiology from Los Andes University in Bogota, Colombia. 
    She earned her PhD in Molecular Microbiology and Microbial Pathogenesis from Washington University in St. Louis, where she worked in the lab of Bill Goldman. 
    She continued her Postdoctoral training in Microbiology and Immunology in the Goldman lab at UNC-Chapel Hill."

