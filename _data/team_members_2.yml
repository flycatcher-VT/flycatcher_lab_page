- name: Oliver Kompathoum 
  photo: oliver.jpg
  info: Computational Biologist
  email: okompath@email.unc.edu
  bio : "Oliver is a computational biologist and bioinformatician whose primary focus in the lab is improving genomic resources for fungal pathogens. He is also responsible for managing 
   the lab's data infrastructure and providing support for data transfers between collaborators. He recieved his BSc in Biology and Minor in Computer Science from Wake Forest University  
   in 2024, and is looking to further his education through a PhD position at Virginia Tech in the fall of 2026. In his free time, Oliver enjoys hiking, cooking, and making music."
   
