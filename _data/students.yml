- name: Oliver Kompathoum 
  photo: oliver.jpg
  info: PhD Student, Behavior and Morphology
  email: okompath35@vt.edu
  bio : "Oliver is a First Year PhD student who is interested in understanding the evolutionary relationship between behavior and morphology using migratory birds as a study system. 
    He received his BSc in Biology from Wake Forest University, where he worked with colubrid cognition and behavior, and furthered his research experience 
    in the Daniel Matute Lab at UNC Chapel Hill as a bioinformatician studying population genetics of fungal pathogens. Outside of the lab, he enjoys the outdoors, table top games, and making music."

